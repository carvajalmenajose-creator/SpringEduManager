<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	th:replace="~{layout/base :: layout('Evaluaciones', ~{::contenido}, ~{::scripts})}">
<div th:fragment="contenido">
	<div class="d-flex justify-content-between align-items-center mb-4">
		<div>
			<h1 class="fw-bold text-dark mb-1"><i class="fa-solid fa-list-check"></i> Evaluaciones</h1>
			<p class="text-muted small mb-0">El profesor registra notas sobre estudiantes y cursos existentes.</p>
		</div>
		<button type="button" class="btn text-white px-4 py-2 shadow-sm rounded-pill fw-semibold" style="background-color: #FB2C36;" data-bs-toggle="modal"
			data-bs-target="#modalEvaluacion" onclick="nuevaEvaluacion()"
			sec:authorize="hasAnyRole('ADMIN','PROFESOR')">
			<i class="fa-solid fa-plus me-2"></i> Nueva Evaluación
		</button>
	</div>

	<div th:if="${error}" class="alert alert-danger rounded-3" th:text="${error}"></div>

	<div class="card shadow-sm border-0 rounded-4 overflow-hidden">
		<div class="table-responsive">
			<table class="table table-hover align-middle mb-0">
				<thead style="background-color: #f8fafc; color: #475569; font-size: 0.85rem; letter-spacing: 0.5px;">
					<tr>
						<th class="py-3 ps-4"><i class="fa-solid fa-hashtag me-2" style="color: #FB2C36;"></i>ID</th>
						<th class="py-3"><i class="fa-solid fa-file-lines me-2" style="color: #FB2C36;"></i>Evaluación</th>
						<th class="py-3"><i class="fa-solid fa-user-graduate me-2" style="color: #FB2C36;"></i>Estudiante</th>
						<th class="py-3"><i class="fa-solid fa-book me-2" style="color: #FB2C36;"></i>Curso</th>
						<th class="py-3"><i class="fa-solid fa-star me-2" style="color: #FB2C36;"></i>Nota</th>
						<th class="py-3 text-center pe-4" sec:authorize="hasAnyRole('ADMIN','PROFESOR')"><i class="fa-solid fa-gears me-2" style="color: #FB2C36;"></i>Opciones</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="evaluacion : ${listaEvaluaciones}">
						<td class="ps-4 fw-bold text-secondary" th:text="${evaluacion.id}"></td>
						<td>
							<div class="d-flex align-items-center">
								<div class="bg-light rounded-circle d-flex align-items-center justify-content-center me-2 shadow-sm" style="width: 32px; height: 32px; min-width: 32px; color: #FB2C36;">
									<i class="fa-solid fa-clipboard-list" style="font-size: 0.85rem;"></i>
								</div>
								<span class="fw-semibold text-dark" th:text="${evaluacion.nombre}"></span>
							</div>
						</td>
						<td>
							<span class="text-muted" th:text="${evaluacion.estudiante}"></span>
						</td>
						<td>
							<span class="text-muted" th:text="${evaluacion.curso}"></span>
						</td>
						<td>
							<span class="badge bg-light text-dark border px-2 py-1 fw-bold" th:text="${evaluacion.nota}"></span>
						</td>
						<td class="text-center pe-4" sec:authorize="hasAnyRole('ADMIN','PROFESOR')">
							<div class="d-flex justify-content-center gap-2">
								<button type="button" class="btn btn-sm btn-outline-warning rounded-pill px-3 shadow-sm" title="Editar"
									data-bs-toggle="modal" data-bs-target="#modalEvaluacion"
									th:data-id="${evaluacion.id}" th:data-nombre="${evaluacion.nombre}"
									th:data-estudiante="${evaluacion.estudiante}" th:data-curso="${evaluacion.curso}"
									th:data-nota="${evaluacion.nota}" onclick="editarEvaluacion(this)"
									sec:authorize="hasAnyRole('ADMIN','PROFESOR')">
									<i class="fa-solid fa-pen-to-square me-1"></i> Editar
								</button>
								<form th:action="@{/evaluaciones/eliminar/{id}(id=${evaluacion.id})}" method="post"
									class="d-inline form-eliminar" th:data-nombre="${evaluacion.nombre}"
									sec:authorize="hasAnyRole('ADMIN','PROFESOR')">
									<button type="submit" class="btn btn-sm btn-outline-danger rounded-pill px-3 shadow-sm" title="Eliminar">
										<i class="fa-solid fa-trash me-1"></i> Eliminar
									</button>
								</form>
							</div>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>

	<div class="modal fade" id="modalEvaluacion" tabindex="-1"
		aria-labelledby="tituloModalEvaluacion" aria-hidden="true"
		sec:authorize="hasAnyRole('ADMIN','PROFESOR')">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content border-0 shadow rounded-4">
				<div class="modal-header border-bottom-0 pb-0 pt-4 px-4">
					<h5 class="modal-title fw-bold text-dark" id="tituloModalEvaluacion">Nueva Evaluación</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
				</div>
				<form th:action="@{/evaluaciones/guardar}" method="post">
					<div class="modal-body px-4 py-3">
						<input type="hidden" id="idEvaluacion" name="id" value="0">
						<div class="mb-3">
							<label for="nombreEvaluacion" class="form-label fw-semibold small text-secondary">Nombre Evaluación</label>
							<input type="text" id="nombreEvaluacion" name="nombre" class="form-control rounded-3" required>
						</div>
						<div class="mb-3">
							<label for="estudianteEvaluacion" class="form-label fw-semibold small text-secondary">Estudiante</label>
							<select id="estudianteEvaluacion" name="estudiante" class="form-select rounded-3" required>
								<option value="">Seleccione un estudiante</option>
								<option th:each="estudiante : ${listaEstudiantes}" th:value="${estudiante.nombre}"
									th:text="${estudiante.nombre}"></option>
							</select>
						</div>
						<div class="mb-3">
							<label for="cursoEvaluacion" class="form-label fw-semibold small text-secondary">Curso</label>
							<select id="cursoEvaluacion" name="curso" class="form-select rounded-3" required>
								<option value="">Seleccione un curso</option>
								<option th:each="curso : ${listaCursos}" th:value="${curso.nombre}"
									th:text="${curso.nombre}"></option>
							</select>
						</div>
						<div class="mb-3">
							<label for="notaEvaluacion" class="form-label fw-semibold small text-secondary">Nota</label>
							<input type="number" step="0.1" min="1" max="7" id="notaEvaluacion" name="nota"
								class="form-control rounded-3" required>
						</div>
					</div>
					<div class="modal-footer border-top-0 pb-4 px-4">
						<button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
						<button type="submit" class="btn text-white rounded-pill px-4 shadow-sm" style="background-color: #FB2C36;">
							<i class="fa-solid fa-floppy-disk me-1"></i> Guardar
						</button>
					</div>
				</form>
			</div>
		</div>
	</div>
</div>
<th:block th:fragment="scripts">
	<script th:src="@{/js/evaluaciones/evaluaciones.js}"></script>
</th:block>
</html>
