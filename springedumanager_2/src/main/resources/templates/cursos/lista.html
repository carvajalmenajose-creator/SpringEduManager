<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	th:replace="~{layout/base :: layout('Cursos', ~{::contenido}, ~{})}">
<div th:fragment="contenido">
	<div class="d-flex justify-content-between align-items-center mb-4">
		<div>
			<h1 class="fw-bold text-dark mb-1"><i class="fa-solid fa-book-open"></i> Cursos</h1>
			<p class="text-muted small mb-0">El profesor crea y actualiza las materias. El administrador también puede hacerlo.</p>
		</div>
		<button type="button" class="btn text-white px-4 py-2 shadow-sm rounded-pill fw-semibold" style="background-color: #FB2C36;" data-bs-toggle="modal"
			data-bs-target="#modalCurso" onclick="nuevoCurso()" sec:authorize="hasAnyRole('ADMIN','PROFESOR')">
			<i class="fa-solid fa-plus me-2"></i> Nuevo Curso
		</button>
	</div>

	<div th:if="${error}" class="alert alert-danger rounded-3" th:text="${error}"></div>
	
	<div class="card shadow-sm border-0 rounded-4 overflow-hidden">
		<div class="table-responsive">
			<table class="table table-hover align-middle mb-0">
				<thead style="background-color: #f8fafc; color: #475569; font-size: 0.85rem; letter-spacing: 0.5px;">
					<tr>
						<th class="py-3 ps-4"><i class="fa-solid fa-hashtag me-2" style="color: #FB2C36;"></i>ID</th>
						<th class="py-3"><i class="fa-solid fa-book me-2" style="color: #FB2C36;"></i>Nombre Curso</th>
						<th class="py-3"><i class="fa-solid fa-align-left me-2" style="color: #FB2C36;"></i>Descripción</th>
						<th class="py-3 text-center pe-4" sec:authorize="hasAnyRole('ADMIN','PROFESOR')"><i class="fa-solid fa-gears me-2" style="color: #FB2C36;"></i>Opciones</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="curso : ${listaCursos}">
						<td class="ps-4 fw-bold text-secondary" th:text="${curso.id}"></td>
						<td>
							<div class="d-flex align-items-center">
								<div class="bg-light rounded-circle d-flex align-items-center justify-content-center me-2 shadow-sm" style="width: 32px; height: 32px; min-width: 32px; color: #FB2C36;">
									<i class="fa-solid fa-book-open" style="font-size: 0.85rem;"></i>
								</div>
								<span class="fw-semibold text-dark" th:text="${curso.nombre}"></span>
							</div>
						</td>
						<td>
							<span class="text-muted" th:text="${curso.descripcion}"></span>
						</td>
						<td class="text-center pe-4" sec:authorize="hasAnyRole('ADMIN','PROFESOR')">
							<div class="d-flex justify-content-center gap-2">
								<button type="button" class="btn btn-sm btn-outline-warning rounded-pill px-3 shadow-sm" title="Editar"
									data-bs-toggle="modal" data-bs-target="#modalCurso" th:data-id="${curso.id}"
									th:data-nombre="${curso.nombre}" th:data-descripcion="${curso.descripcion}"
									onclick="editarCurso(this)" sec:authorize="hasAnyRole('ADMIN','PROFESOR')">
									<i class="fa-solid fa-pen-to-square me-1"></i> Editar
								</button>
								<form th:action="@{/cursos/eliminar/{id}(id=${curso.id})}" method="post"
									class="d-inline form-eliminar" th:data-nombre="${curso.nombre}"
									sec:authorize="hasAnyRole('ADMIN','PROFESOR')">
									<button type="submit" class="btn btn-sm btn-outline-danger rounded-pill px-3 shadow-sm" title="Eliminar">
										<i class="fa-solid fa-trash me-1"></i> Eliminar
									</button>
								</form>
							</div>
						</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>

	<!-- Modal Curso -->
	<div class="modal fade" id="modalCurso" tabindex="-1" aria-labelledby="tituloModalCurso"
		aria-hidden="true" sec:authorize="hasAnyRole('ADMIN','PROFESOR')">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content border-0 shadow rounded-4">
				<div class="modal-header border-bottom-0 pb-0 pt-4 px-4">
					<h5 class="modal-title fw-bold text-dark" id="tituloModalCurso">Nuevo Curso</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
				</div>
				<form th:action="@{/cursos/guardar}" method="post">
					<div class="modal-body px-4 py-3">
						<input type="hidden" id="idCurso" name="id" value="0">
						<div class="mb-3">
							<label for="nombreCurso" class="form-label fw-semibold small text-secondary">Nombre Curso</label>
							<input type="text" id="nombreCurso" name="nombre" class="form-control rounded-3" required>
						</div>
						<div class="mb-3">
							<label for="descripcionCurso" class="form-label fw-semibold small text-secondary">Descripción</label>
							<textarea id="descripcionCurso" name="descripcion" class="form-control rounded-3" rows="4"></textarea>
						</div>
					</div>
					<div class="modal-footer border-top-0 pb-4 px-4">
						<button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
						<button type="submit" class="btn text-white rounded-pill px-4 shadow-sm" style="background-color: #FB2C36;">
							<i class="fa-solid fa-floppy-disk me-1"></i> Guardar
						</button>
					</div>
				</form>
			</div>
		</div>
	</div>

	<script>
		const idCurso = document.getElementById('idCurso');
		const nombreCurso = document.getElementById('nombreCurso');
		const descripcionCurso = document.getElementById('descripcionCurso');
		const tituloModalCurso = document.getElementById('tituloModalCurso');

		function nuevoCurso() {
			if (!idCurso) {
				return;
			}
			tituloModalCurso.textContent = 'Nuevo Curso';
			idCurso.value = 0;
			nombreCurso.value = '';
			descripcionCurso.value = '';
		}

		function editarCurso(boton) {
			if (!idCurso) {
				return;
			}
			tituloModalCurso.textContent = 'Editar Curso';
			idCurso.value = boton.dataset.id;
			nombreCurso.value = boton.dataset.nombre;
			descripcionCurso.value = boton.dataset.descripcion;
		}
	</script>
</div>
</html>
