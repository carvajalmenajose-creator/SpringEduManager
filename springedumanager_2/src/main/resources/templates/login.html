<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar Sesión | SpringEduManager</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100 justify-content-center">
	<div class="container my-5">
		<div class="row justify-content-center">
			<div class="col-md-5">
				<div class="card shadow-sm border-0 rounded-4">
					<div class="card-body p-4 p-md-5">
						
						<!-- Encabezado con Icono y Color Personalizado -->
						<div class="text-center mb-4">
							<div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3 shadow-sm" style="width: 60px; height: 60px; background-color: #FB2C36; color: white;">
								<i class="fa-solid fa-people-roof fa-xl"></i>
							</div>
							<h3 class="fw-bold text-dark mb-1">SpringEduManager</h3>
							<p class="text-muted small">Sistema de Gestión Académica</p>
						</div>

						<!-- Alertas de Error o Logout -->
						<div th:if="${param.error}" class="alert alert-danger rounded-3 py-2 small text-center" role="alert">
							<i class="fa-solid fa-circle-exclamation me-1"></i> Credenciales incorrectas
						</div>
						<div th:if="${param.logout}" class="alert alert-success rounded-3 py-2 small text-center" role="alert">
							<i class="fa-solid fa-circle-check me-1"></i> Sesión cerrada correctamente
						</div>

						<!-- Formulario -->
						<form th:action="@{/login}" method="post">
							<div class="mb-3">
								<label class="form-label fw-semibold small text-secondary">Correo electrónico</label>
								<div class="input-group">
									<span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-envelope"></i></span>
									<input type="email" class="form-control border-start-0 ps-0" name="correo"
										placeholder="correo@SpringEduManager.cl" required>
								</div>
							</div>
							<div class="mb-4">
								<label for="password" class="form-label fw-semibold small text-secondary">Contraseña</label>
								<div class="input-group">
									<span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
									<input type="password" class="form-control border-start-0 border-end-0 ps-0" id="password" name="password" required>
									<button class="btn btn-outline-secondary border-start-0 bg-light text-muted" type="button" id="btnMostrarPassword">
										<i class="fa-solid fa-eye" id="iconoPassword"></i>
									</button>
								</div>
							</div>
							<button type="submit" class="btn text-white w-100 py-2 fw-semibold shadow-sm" style="background-color: #FB2C36;">
								<i class="fa-solid fa-right-to-bracket me-2"></i> Ingresar
							</button>
						</form>

						<!-- Credenciales de Prueba Actualizadas -->
						<div class="mt-4 pt-3 border-top text-muted" style="font-size: 0.75rem;">
							<p class="mb-1 fw-semibold text-secondary"><i class="fa-solid fa-circle-info me-1" style="color: #FB2C36;"></i> Usuarios de prueba (Clave: <code>1234</code>):</p>
							<div class="bg-light p-2 rounded-3 text-secondary">
								<strong>ADMIN:</strong> admin@springedumanager.cl<br>
								<strong>PROFESOR:</strong> carla.soto@springedumanager.cl<br>
								<strong>ESTUDIANTE:</strong> jcarvajal@gmail.com
							</div>
						</div>

					</div>
				</div>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		const password = document.getElementById("password");
		const btnMostrarPassword = document.getElementById("btnMostrarPassword");
		const iconoPassword = document.getElementById("iconoPassword");

		btnMostrarPassword.addEventListener("click", function () {
			if (password.type === "password") {
				password.type = "text";
				iconoPassword.classList.remove("fa-eye");
				iconoPassword.classList.add("fa-eye-slash");
			} else {
				password.type = "password";
				iconoPassword.classList.remove("fa-eye-slash");
				iconoPassword.classList.add("fa-eye");
			}
		});
	</script>
</body>
</html>
