<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
	th:fragment="layout(titulo, contenido, scripts)">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${titulo} + ' | SpringEduManager'">SpringEduManager</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="d-flex flex-column min-vh-100">
	<nav class="navbar navbar-expand-lg mb-4 shadow-sm" style="background-color: #FB2C36;" data-bs-theme="dark">
		<div class="container">
			<a class="navbar-brand fw-bold d-flex flex-column align-items-center text-center p-0 text-white" style="line-height: 3;" th:href="@{/home}">
				<i class="fa-solid fa-people-roof fa-lg mb-1 mt-2"></i>
				<span style="font-size: 0.90rem;">SGA</span>
			</a>
			<button class="navbar-toggler border-0 shadow-none text-white" type="button" data-bs-toggle="collapse"
				data-bs-target="#navbarPrincipal" aria-controls="navbarPrincipal"
				aria-expanded="false" aria-label="Abrir navegación">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarPrincipal">
				<ul class="navbar-nav me-auto mb-2 mb-lg-0">
					<li class="nav-item">
						<a class="nav-link fw-semibold text-white" th:href="@{/home}">Inicio</a>
					</li>
					<li class="nav-item">
						<a class="nav-link fw-semibold text-white" th:href="@{/estudiantes/listar}">Estudiantes</a>
					</li>
					<li class="nav-item" sec:authorize="hasRole('ADMIN')">
						<a class="nav-link fw-semibold text-white" th:href="@{/profesores/listar}">Profesores</a>
					</li>
					<li class="nav-item">
						<a class="nav-link fw-semibold text-white" th:href="@{/cursos/listar}">Cursos</a>
					</li>
					<li class="nav-item">
						<a class="nav-link fw-semibold text-white" th:href="@{/evaluaciones/listar}">Evaluaciones</a>
					</li>
					<li class="nav-item" sec:authorize="hasRole('ADMIN')">
						<a class="nav-link fw-semibold text-white" th:href="@{/usuarios/listar}">Usuarios</a>
					</li>
				</ul>
				<div class="d-flex align-items-center">
					<span class="me-3 fw-semibold text-white">
						Hola, <strong sec:authentication="principal.nombre"></strong>
						<small class="text-white-50" sec:authentication="principal.rol"></small>
					</span>
					<form th:action="@{/logout}" method="post" class="m-0">
						<button type="submit" class="btn btn-link p-0 text-white" title="Cerrar sesión">
							<i class="fa-solid fa-right-from-bracket"></i>
						</button>
					</form>
				</div>
			</div>
		</div>
	</nav>
	<main class="container flex-grow-1">
		<div th:replace="${contenido}">Contenido</div>
	</main>
	<footer class="text-center py-3 mt-5 text-white shadow-sm" style="background-color: #FB2C36;">
		<div class="container">
			<small class="fw-semibold">SpringEduManager &copy; 2026 - SGA</small>
		</div>
	</footer>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<script th:src="@{/js/confirmacion-eliminar.js}"></script>
	<th:block th:replace="${scripts}"></th:block>
</body>
</html>
